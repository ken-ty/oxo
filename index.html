<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OXO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-title">OXO</div>
  <div class="rules">
    <strong>ルール:</strong><br>
    ・先手は黒、交互に2つずつコマを置きます。<br>
    ・1つ目のコマを置いた後、縦・横・斜めの軸に線対称となる位置に2つ目を置きます。<br>
    ・中央には白いコマが初めから置かれています。<br>
    ・以下の形を作ると勝ちです：<br>
    - 2×2の正方形<br>
    - 十字形（縦横 or 斜め）
  </div>
  <div id="status" class="game-status">黒の番です</div>
  <div class="game-container">
    <div class="row-labels">
      <div>7</div><div>6</div><div>5</div><div>4</div><div>3</div><div>2</div><div>1</div>
    </div>
    <div id="board" class="board"></div>
  </div>
  <div class="col-labels">
    <div></div>
    <div>a</div><div>b</div><div>c</div><div>d</div><div>e</div><div>f</div><div>g</div>
  </div>
  <div id="record" class="game-record"></div>
  <div class="game-controls">
    <button class="game-button" id="undo-button">待った</button>
    <button class="game-button" id="reset-button">リセット</button>
  </div>

  <div class="game-footer">製作：上田悠</div>
  <script src="game.js"></script>
</body>
</html>
